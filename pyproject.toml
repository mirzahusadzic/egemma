[project]
name = "egemma"
version = "0.5.0"
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md", "LICENSES/*"]

[tool.pytest.ini_options]
addopts = "--cov=src --cov-report=term-missing --cov-fail-under=80 --import-mode=importlib"
testpaths = [
    "tests/",
]
pythonpath = [".", "src"]
